services:
  postgres:
    image: postgres:16
    container_name: postgres_db

    environment:
      POSTGRES_DB: product_service
      POSTGRES_USER: redis
      POSTGRES_PASSWORD: root

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data


  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    restart: unless-stopped


volumes:
  postgres-data:
  redis-data:

