spring:
  application:
    name: redis-demo-application

  datasource:
    url: jdbc:postgresql://localhost:5432/redisdb
    username: redis
    password: postgres
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379

redis:
  cache:
    ttl: 600

logging:
  level:
    root: INFO
    com.redis: DEBUG